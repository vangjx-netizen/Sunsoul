# Publishes the site and the Firestore security rules to Firebase (project sunsoul-01)
# every time main changes, using the key stored in the repository secret FIREBASE_SERVICE_ACCOUNT.
# The page code is checked first: if an edit broke it, nothing is deployed and the live site keeps
# the last working version (the run shows a red ✗ with the line that is wrong).
name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firestore.rules"
      - "firebase.json"
      - "tools/check_page.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the page code (stops the deploy if an edit broke it)
        run: node tools/check_page.js

      - name: No key yet
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set yet, so nothing was deployed."

      - name: Deploy site and Firestore rules
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          npx --yes firebase-tools@15.34.2 deploy --only hosting,firestore:rules --project sunsoul-01 --non-interactive
          rm -f "$RUNNER_TEMP/key.json"
