<style>
/* Visual design follows the owner's own mock-up: cream background, orange accent, Noto Sans Lao, 3-tab bottom bar, dark team header. Dark theme is an added counterpart. */

--accent:#F0884A;--accent-h:#FFA46C;--on-accent:#1C0F05;--green:#6CCBB5;--green-bg:#16312B;--blue:#9DBFEF;--blue-bg:#1B2A40;
--amber-bg:#3A2F14;--amber-ink:#F2D58C;--amber-ink2:#F2B33D;--red-bg:#3D2318;--bad:#FF8A7E;--inv:#F2EFE8;--on-inv:#1C1B18;
--hdr:#0C0B09;--on-hdr:#F2EFE8;--hdr-btn:#26241F;--hdr-sub:#B3AD9F;--off:#A29C8E;--hero1:#2A1A0A;--hero2:#3D2410;--hero-sub:#F2D58C;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0C0B09;--bg:#151410;--card:#201F1B;--ink:#F2EFE8;--muted:#B3AD9F;--line:#35332C;--line2:#524F46;--soft:#2B2924;
--accent:#F0884A;--accent-h:#FFA46C;--on-accent:#1C0F05;--green:#6CCBB5;--green-bg:#16312B;--blue:#9DBFEF;--blue-bg:#1B2A40;
--amber-bg:#3A2F14;--amber-ink:#F2D58C;--amber-ink2:#F2B33D;--red-bg:#3D2318;--bad:#FF8A7E;--inv:#F2EFE8;--on-inv:#1C1B18;
--hdr:#0C0B09;--on-hdr:#F2EFE8;--hdr-btn:#26241F;--hdr-sub:#B3AD9F;--off:#A29C8E;--hero1:#2A1A0A;--hero2:#3D2410;--hero-sub:#F2D58C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f);line-height:1.5;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
.hd{padding:18px 20px 14px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}

.hd.res{flex-direction:column;align-items:stretch;padding:14px 16px 12px;gap:10px}
.hrow{display:flex;align-items:center;gap:10px}
.bk{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ht{flex:1;min-width:0;display:flex;flex-direction:column}

.hd.team{background:var(--hdr);color:var(--on-hdr);border-bottom:0;padding:14px 16px;justify-content:flex-start}

main{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.lb{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:12px;background:var(--soft)}

.seg.sm{padding:3px;border-radius:10px}.seg.sm button{height:40px;border-radius:8px;font-size:14px}
.cta{height:56px;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700}

.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12px;font-weight:600;text-align:center;line-height:1.3;padding:0}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat i{background:color-mix(in srgb,var(--c) 30%,var(--card));color:var(--ink)}}
:root[data-theme="dark"] .cat i{background:color-mix(in srgb,var(--c) 30%,var(--card));color:var(--ink)}
.hero{margin:-18px -16px 0;padding:16px 16px 18px;background:linear-gradient(165deg,var(--hero1),var(--hero2));border-radius:0 0 24px 24px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}.brand svg{flex-shrink:0}
.wm{display:block;font-family:var(--fn);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1;color:var(--ink)}.wm span{color:var(--accent)}
.brand small{display:block;font-size:13px;color:var(--hero-sub);margin-top:2px}
.qb{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px}.qbl{flex-shrink:0;font-size:13px;font-weight:700;color:var(--hero-sub)}
.qbtn{flex:1 0 auto;height:38px;padding:0 10px;border-radius:999px;border:0;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}.qbtn b{font-family:var(--fn);font-weight:700}

.nav{position:sticky;bottom:0;height:74px;flex-shrink:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;border-top:3px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--off);font-size:13px;font-weight:600;padding:0 2px}
.nav button[aria-current=page]{color:var(--accent);border-top-color:var(--accent);font-weight:700}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);white-space:nowrap;font-size:14px;flex-shrink:0}
.cnt{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cnt span:last-child{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.ph img,.noimg{display:block;width:100%;height:100%;object-fit:cover}
.noimg{display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--soft)}
.badge{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--green-bg);color:var(--green)}
.badge.over{background:var(--amber-bg);color:var(--amber-ink2)}
.nph{position:absolute;top:8px;right:8px;background:var(--shade);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.info{padding:10px;display:flex;flex-direction:column;gap:2px}
.info h3{margin:0;font-size:15px;line-height:1.35}
.shop{font-size:12px;color:var(--muted)}
.total{font-size:18px;font-weight:700;font-family:var(--fn);margin-top:4px}
.total small{font-size:13px;font-family:var(--f);font-weight:600}
.brk{font-size:12px;color:var(--muted)}
.vb{display:inline-block;font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:999px;padding:1px 7px;white-space:nowrap;font-family:var(--f)}
.trust{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px}
.trust p{margin:0;text-align:left}.trust i{font-style:normal}.trust .tr1{display:flex;gap:10px;align-items:center}.trust .tx{display:flex;flex-direction:column}.trust .tx b{font-size:14px}.trust .tx small{font-size:12px;color:var(--muted)}
.vbig{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}.vbig.off{background:var(--line2);color:var(--muted)}
.trust .tr1+.tr2{border-top:1px solid var(--line);padding-top:8px}.trust .tr2{display:flex;gap:8px;align-items:flex-start}.trust .tr2 small{font-size:13px;color:var(--ink)}
.shipb{font-size:12px;font-weight:600;color:var(--green)}.shipb.far{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:14px}
/* product */
.gal{position:relative;height:min(420px,100vw);flex-shrink:0;background:var(--soft);touch-action:pan-y}
.gal>button.gi{position:absolute;inset:0;width:100%;border:0;padding:0;background:none;display:block}
.gal img{width:100%;height:100%;object-fit:contain;display:block}
.rnd{position:absolute;top:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:2px}

.dots button[aria-current=true] span{width:22px;opacity:1}
.ptitle{margin:0;font-size:22px;line-height:1.35}
.psub{font-size:14px;color:var(--muted)}
.vopts{display:flex;flex-wrap:wrap;gap:8px}
.vo{min-width:72px;min-height:54px;padding:4px 12px;border-radius:12px;border:2px solid var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.vo b{font-size:16px;font-weight:700;font-family:var(--fn)}.vo span{font-size:11px}
.vo[aria-pressed=true]{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.vo:disabled{background:var(--soft);color:var(--off);cursor:not-allowed}.vo:disabled b{text-decoration:line-through}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ln{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.ln.t{padding-top:6px;border-top:1px solid var(--line);font-weight:700;font-size:17px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk svg{color:var(--green);flex-shrink:0}
.buy{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.buy .pr{display:flex;flex-direction:column;min-width:0}.buy .pr span{font-size:12px;color:var(--muted)}.buy .pr b{font-size:20px;font-family:var(--fn)}
.buy .cta{flex:1}
.buy .cartb{height:56px;padding:0 14px;flex-shrink:0}.buy .cartb:disabled{opacity:.5;cursor:not-allowed}
.nic{position:relative;display:inline-flex}.nbadge{position:absolute;top:-6px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;line-height:18px;text-align:center;font-family:var(--fn)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
/* dialogs */
dialog{max-width:min(430px,calc(100% - 24px));width:100%;border:0;border-radius:18px;padding:16px;background:var(--card);color:var(--ink);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(5,5,5,.65)}
dialog h2{margin:0 0 10px;font-size:18px}
.zrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin-block:6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.zrow[aria-pressed=true]{border-color:var(--accent)}
.zn{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--fn)}
.zt{flex:1;min-width:0;display:flex;flex-direction:column}.zt b{font-size:15px}.zt span{font-size:12px;color:var(--muted)}
dialog#lb{max-width:100%;max-height:100%;width:100%;height:100%;margin:0;border-radius:0;background:#000;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}

.lbtop,.lbnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lbtop button,.lbnav button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #666;background:#222;color:#fff}
.lbimg{flex:1;min-height:0;overflow:auto;display:flex}
.lbimg img{margin:auto;max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.lbimg.z img{max-width:none;max-height:none;width:220%;cursor:zoom-out}
/* team forms */
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
.fld input,.fld select,.fld textarea{height:48px;width:100%;padding:0 12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);font-size:16px;font-weight:400}
.fld textarea{height:auto;padding:10px 12px}
.fld small{font-weight:400;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pt{aspect-ratio:1;border-radius:10px;background:var(--soft);position:relative;overflow:hidden}

.kw{display:flex;flex-wrap:wrap;gap:6px}

.kw span button{width:24px;height:24px;border:0;background:none;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center}
.kwadd{display:flex;gap:6px}.kwadd input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:999px;border:1.5px dashed var(--line2);background:var(--card);font-size:14px}
.kwadd button{height:40px;padding:0 14px;border-radius:999px;border:1.5px dashed var(--line2);background:var(--card);font-size:14px;font-weight:600}
.vt{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vh,.vr{display:grid;grid-template-columns:42px 1.1fr 1.3fr .8fr 34px;gap:8px;padding:6px 10px;align-items:center}
.vh{background:var(--soft);font-size:12px;font-weight:700;color:var(--muted);padding-block:8px}
.vr{border-top:1px solid var(--line)}

.vr button{width:34px;height:34px;border:0;background:none;color:var(--bad);display:flex;align-items:center;justify-content:center;padding:0}
.vr button:disabled{opacity:.3}
.vr .vph{width:40px;height:40px;border-radius:8px;border:1.5px dashed var(--line2);background:var(--card);color:var(--muted);overflow:hidden;padding:0}.vr .vph img{width:100%;height:100%;object-fit:cover;display:block}
.slipprev{display:flex;gap:10px;align-items:center;justify-content:center}.slipprev img{width:120px;max-height:180px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:zoom-in}
.evl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}.evl li{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.evl li:last-child{border-bottom:0}.evt{font-size:11px;color:var(--muted);font-family:var(--fn);line-height:1.3}

/* collapse runs of spaces so "ຮ້ານ  ເຈເຈ" (typed with two spaces) still matches the shop "ຮ້ານ ເຈເຈ" */
const norm=s=>String(s||"").toLowerCase().normalize("NFC").replace(/\s+/g," ").trim();
function score(p,q){
 const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return 1;
 let sc=0;
 for(const t of toks){
  let m=0;
  if(norm(p.name).includes(t))m=3;
  else if(norm(p.keywords).includes(t))m=2;
  else if(norm(p.shopName).includes(t)||norm(catLabel(p)).includes(t))m=1;
  if(!m)return 0;sc+=m;
 }
 return sc;
}

 }).filter(r=>r.sc>0&&(!S.cat||catKey(r.p)===S.cat)&&(!S.door||pMode(r.p)==="door"));
 const all=rows.length;
 if(S.mode==="under"&&B)rows=rows.filter(r=>r.price<=B);

  :(a,b)=>Math.abs(B-a.price)-Math.abs(B-b.price)||b.sc-a.sc;

}

/* product photos are cut to a centred square so every tile in the feed has the same shape; slips and other photos keep their shape */
function cropRect(bmp,square){
 if(!square)return {x:0,y:0,w:bmp.width,h:bmp.height};
 const s=Math.min(bmp.width,bmp.height);return {x:Math.round((bmp.width-s)/2),y:Math.round((bmp.height-s)/2),w:s,h:s};
}
async function compress(file,square){
 const bmp=await createImageBitmap(file),r=cropRect(bmp,square),k=Math.min(1,1280/Math.max(r.w,r.h));
 const c=document.createElement("canvas");c.width=Math.round(r.w*k);c.height=Math.round(r.h*k);
 c.getContext("2d").drawImage(bmp,r.x,r.y,r.w,r.h,0,0,c.width,c.height);
 return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.82));
}
async function addPhotos(files){
 if(!H.assets){toast(T.noAssets);return}
 for(const f of files){
  try{const b=await compress(f);const r=await assetUp(b);S.draft.imgs.push(r.id);renderPhotos()}
  catch(e){toast(T.photoFail+(e&&e.code?" ("+e.code+")":""))}
 }
}

async function saSend(){

 const I=D.item,price=num(I.price),qty=Math.max(1,num(I.qty)||1),kg=kgNum(I.weight);
 if(!I.imgs.length)need.push(T.siNeedPh);if(!String(I.name).trim())need.push(T.pName);if(!(price>0))need.push(T.vPrice);
 if(!String(I.cat).trim())need.push(T.pCat);if(!kg)need.push(T.pWeight);else if(kg>DEL().maxKg)need.push(T.errHeavy(DEL().maxKg));

 requestAnimationFrame(()=>{feedBusy=false;
  if(S.feedN>=feedRows().length)return;
  if(innerHeight+scrollY>document.documentElement.scrollHeight-700){S.feedN+=20;updateFeed()}
 });
},{passive:true});
app.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="bud"){S.budget=num(t.value);t.value=S.budget?fmt(S.budget):"";return}
 if(t.id==="kmcalc"){const r=$("#kmres"),f=feeKm(t.value);if(r)r.textContent=f===null?"":fmt(f)+" "+T.kip;return}
 if(t.dataset.co){S.co[t.dataset.co]=t.value;return}
 if(t.id==="q"){S.name=t.value;return}
 if(t.dataset.f&&S.draft){S.draft[t.dataset.f]=t.value;return}
 if(t.dataset.v&&S.draft){const [i,k]=t.dataset.v.split(":");S.draft.variants[+i][k]=t.value;return}
 if(t.dataset.sf&&S.sdraft){S.sdraft[t.dataset.sf]=t.value}
});
app.addEventListener("change",async e=>{
 const t=e.target;
 if(t.id==="pfile"){const fs=[...t.files];t.value="";addPhotos(fs);return}
 if(t.dataset.act==="active"){
  const p=ST.products.find(x=>x.id===t.dataset.id);if(!p)return;
  const tl=t.parentElement.querySelector(".tl"),say=()=>{if(tl)tl.textContent=t.checked?T.sellOn:T.sellOff};say();
  try{await put(pcoll(p),p.id,{...pdoc(p),active:t.checked})}catch(err){toast((err&&err.message)||"error");t.checked=!t.checked;say()}
  return}
 if(t.dataset.f&&S.draft){S.draft[t.dataset.f]=t.value;return}
 if(t.dataset.sfver!==undefined&&S.sdraft){S.sdraft.verified=t.checked;return}
 if(t.dataset.agree!==undefined&&S.sdraft){S.sdraft.agreed=t.checked;render();return}
 if(t.dataset.pk&&S.sdraft){S.sdraft.pickup=t.dataset.pk;render();return}
 if(t.dataset.sf&&S.sdraft){S.sdraft[t.dataset.sf]=t.value}
});
/* swipe on the product gallery */
let sx=null;
app.addEventListener("touchstart",e=>{sx=e.target.closest("#gal")?e.touches[0].clientX:null},{passive:true});
app.addEventListener("touchend",e=>{
 if(sx===null)return;const p=curProduct(),n=p?vimgs(p,priced(p)[S.vi]).length:0,dx=e.changedTouches[0].clientX-sx;sx=null;
 if(n>1&&Math.abs(dx)>50){S.img=(S.img+(dx<0?1:n-1))%n;render()}
});

/* ---- test QR (a decorative pattern, NOT a real payment code) ---- */
function qrSvg(seed){
 let h=2166136261;for(const c of String(seed)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
 const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 const N=25,g=Array.from({length:N},()=>Array(N).fill(0));
 const finder=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||j===0||i===6||j===6,c=i>=2&&i<=4&&j>=2&&j<=4;g[y+i][x+j]=e||c?1:0}};
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)g[y][x]=rnd()<.5?1:0;
 [[0,0],[N-7,0],[0,N-7]].forEach(([x,y])=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const yy=y+i,xx=x+j;if(yy>=0&&yy<N&&xx>=0&&xx<N)g[yy][xx]=0}finder(x,y)});
 let r="";for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
 return `<svg viewBox="-1 -1 ${N+2} ${N+2}" fill="#111" shape-rendering="crispEdges" role="img" aria-label="${T.qrTest}"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${r}</svg>`;
}

/* ---- receiving account: LAO QR (EMVCo / LAPNet) ----
   The team stores the bank's static QR text. For each order the page rebuilds it as a dynamic QR with the exact amount
   (tag 54, point-of-initiation 12, new CRC) so the customer's bank app fills the amount in. */
const tlv=s=>{const o=[];let i=0;while(i+4<=s.length){const t=s.substr(i,2),n=parseInt(s.substr(i+2,2),10);if(isNaN(n)||i+4+n>s.length)return null;o.push([t,s.substr(i+4,n)]);i+=4+n}return i===s.length?o:null};
const crc16=d=>{let c=0xFFFF;for(const ch of new TextEncoder().encode(d)){c^=ch<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")};
function qrCheck(x){const s=String(x||"").trim(),L=tlv(s);if(!L||!L.length||L[0][0]!=="00")return "";const c=L[L.length-1];if(c[0]!=="63"||crc16(s.slice(0,-4))!==c[1].toUpperCase())return "";return s}
function qrWithAmount(s,amt){const m=new Map(tlv(s).filter(([t])=>t!=="63"&&t!=="54"));if(amt>0){m.set("01","12");m.set("54",String(Math.round(amt)))}
 const body=[...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([t,v])=>t+String(v.length).padStart(2,"0")+v).join("")+"6304";return body+crc16(body)}
function qrImg(text){if(typeof qrcode!=="function")return "";try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createDataURL(6,3)}catch(e){return ""}}

/* ---- return policy ----
   Accepted: wrong item, damaged, far from the listing, empty box / missing parts, never arrived.
   Not accepted: change of mind, no unboxing video, reported late, used, defects stated in the listing.
   Who pays: whoever saw the goods last before the carrier.
     - Sunsoul picked up (and packed) the goods and photographed them in good order → Sunsoul pays.
     - the photos already show the problem → the shop pays.
     - the shop packed and shipped itself → the shop pays, always; the customer is refunded from the money
       Sunsoul still holds, and the shop is not paid for that order. */

 if(RT_VIDEO.includes(c.reason)&&c.video===false)return {owner:"none",why:T.sgNoVideo,noWhy:"noproof"};
 if(shipperOf(o)==="shop")return {owner:"store",why:T.sgShopShip};
 if(c.reason==="missing")return {owner:"us",why:T.sgLost};
 const ans=S.nf["cpk"+c.id];
 if(ans==="ok")return {owner:"us",why:T.sgTeamOk};
 if(ans==="bad")return {owner:"store",why:T.sgTeamBad};
 return {owner:"",why:T.sgAsk};
}

/* ---- sweeper: orders that ran out of time are cancelled by an editor's session ---- */
let sweeping=false;
async function sweep(){
 if(sweeping||!S.canAdmin||!S.ready)return;sweeping=true;
 try{
  const now=Date.now();
  for(const o of ST.orders){
   if(o.status==="await_shop"&&o.shopDeadline&&o.shopDeadline<now)await setOrder(o,{status:"cancelled",cancelWhy:"shop"},"system","await_shop");
   else if(o.status==="await_pay"&&!o.slipRejected&&o.payDeadline&&o.payDeadline<now)await setOrder(o,{status:"cancelled",cancelWhy:"pay"},"system","await_pay");
  }
 }catch(e){}
 sweeping=false;
}
setInterval(sweep,30000);

/* ---- customer profile: login + address book, kept in the viewer's private db space (data/users/<id>/profile),
   so one phone confirmation lasts across visits even when browser storage is cleared. Browser storage stays as a fast first guess. ---- */
S.addrs=(()=>{try{const a=JSON.parse(LS.get("ss_addrs")||"[]");return Array.isArray(a)?a:[]}catch(e){return []}})();
function profRef(){return H.db&&H.uid?H.db.collection("data/users/"+H.uid).doc("profile"):null}
async function loadProfile(){
 try{
  if(!H.user||typeof H.user.id!=="function")return;
  H.uid=await H.user.id();const r=profRef();if(!r)return;
  const snap=await r.get();if(!snap.exists)return;const d=snap.data()||{};
  if(d.phone&&!S.user){S.user={phone:d.phone,name:d.name||""};LS.set("ss_user",JSON.stringify(S.user))}
  if(Array.isArray(d.addrs)&&d.addrs.length){S.addrs=d.addrs;LS.set("ss_addrs",JSON.stringify(S.addrs))}
 }catch(e){}
}
function saveProfile(){
 LS.set("ss_addrs",JSON.stringify(S.addrs));
 const r=profRef();if(!r)return;
 r.set({phone:S.user?S.user.phone:"",name:S.user?S.user.name||"":"",addrs:S.addrs,updatedAt:Date.now()}).catch(()=>{});
}

 S.addrs=[a,...S.addrs.filter(x=>k(x)!==k(a))].slice(0,5);saveProfile();
}
